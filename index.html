<!doctype html>
<html lang="en" class="locked">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbdbe2" />
    <title>Parushi &amp; Rishabh</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="description" content="You're invited. Tap to open the invitation." />
    <meta property="og:title" content="You're invited" />
    <meta property="og:description" content="A tiny world, four celebrations and one very determined beagle." />
  </head>
  <body>
    <canvas id="gl" aria-hidden="true"></canvas>

    <div id="loader" role="status" aria-label="Loading the invitation">
      <p>Tying the thread</p>
      <div class="bar"><div class="fill"></div></div>
    </div>

    <div id="intro">
      <button id="tap" type="button">
        <span class="ring" aria-hidden="true"></span>
        <span class="label">Help the pup open it</span>
      </button>
      <p class="continue">Tap to step inside</p>
      <button id="skip" type="button">Skip intro</button>
    </div>

    <main id="story"></main>

    <div id="chrome">
      <nav id="dots" aria-label="Chapters"></nav>
    </div>
    <button id="sound" type="button" aria-pressed="true" aria-label="Mute music">
      <i></i><i></i><i></i><i></i>
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
